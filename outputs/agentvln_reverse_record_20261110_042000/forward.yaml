/forward/planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 3.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 1.669
      reverse_penalty: 1.05
      change_penalty: 0.0
      non_straight_penalty: 1.2
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 5.5
      smooth_path: true
      tolerance: 0.1
      use_astar: false
/forward/global_costmap/global_costmap:
  ros__parameters:
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: base_link
    use_sim_time: true
    footprint: '[[-0.184, -0.393], [0.834, -0.393], [0.834, 0.393], [-0.184, 0.393]]'
    resolution: 0.05
    track_unknown_space: true
    plugins:
    - static_layer
    - obstacle_layer
    - inflation_layer
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: true
        marking: true
        data_type: LaserScan
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_subscribe_transient_local: true
      map_topic: /map
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      cost_scaling_factor: 5.0
      inflation_radius: 0.68
    always_send_full_costmap: true
    footprint_padding: 0.075
